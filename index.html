<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ယာဉ်နံပါတ် စစ်ဆေးရန်</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --danger: #f43f5e;
            --bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-card {
            width: 90%;
            max-width: 380px;
            background: white;
            padding: 40px 25px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Calendar Widget */
        .calendar-widget {
            width: 90px;
            margin: 0 auto 25px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        .cal-month { background: var(--primary); color: white; padding: 5px; font-size: 0.75rem; font-weight: bold; }
        .cal-day { font-size: 2.2rem; font-weight: 800; color: #1f2937; padding: 8px 0; }

        h2 { color: #1f2937; font-size: 1.3rem; margin-bottom: 25px; }

        input {
            width: 100%;
            padding: 18px;
            margin-bottom: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 18px;
            font-size: 1.1rem;
            text-align: center;
            box-sizing: border-box;
            background: #f8fafc;
            text-transform: uppercase;
        }

        .btn-check {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* Modal Structure */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            width: 85%;
            max-width: 340px;
            padding: 35px 20px;
            border-radius: 35px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-icon { font-size: 4rem; margin-bottom: 10px; display: block; }
        .modal-msg { font-size: 1.1rem; color: #374151; margin-bottom: 25px; line-height: 1.5; }
        .car-tag { font-weight: 800; color: #000; font-size: 1.3rem; display: block; margin: 5px 0; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; }

        /* အချိန်စာရင်းခလုတ် - ထင်ရှားသောအရောင် */
        .btn-pdf { 
            padding: 16px; 
            background: #1e293b; 
            color: white; 
            border: none; 
            border-radius: 15px; 
            font-weight: bold; 
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        /* ပိတ်မယ်ခလုတ် - အရောင်ဖျော့ဖျော့ */
        .btn-close { 
            padding: 12px; 
            background: #f1f5f9; /* Light grey background */
            color: #94a3b8;      /* Muted text color */
            border: 1px solid #e2e8f0; 
            border-radius: 15px; 
            font-weight: 600; 
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-close:hover {
            background: #e2e8f0;
            color: #64748b;
        }

    </style>
</head>
<body>

<div class="app-card">
    <div class="calendar-widget">
        <div id="monthLabel" class="cal-month">MMM</div>
        <div id="dayLabel" class="cal-day">00</div>
    </div>
    <h2>ယာဉ်မောင်းနှင်ခွင့် စစ်ဆေးမည်</h2>
    <input type="text" id="carInput" placeholder="ဥပမာ- 21A/1234">
    <button class="btn-check" onclick="runCheck()">စစ်ဆေးမည်</button>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal">
        <span id="mIcon" class="modal-icon"></span>
        <div id="mText" class="modal-msg"></div>
        <div class="btn-group">
            <button class="btn-pdf" onclick="generatePDF()">📅 တလစာ အချိန်စာရင်း</button>
            <button class="btn-close" onclick="closeModal()">ပိတ်မယ်</button>
        </div>
    </div>
</div>

<script>
    // (JavaScript logic remains the same as previously provided)
    const today = new Date();
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    document.getElementById('dayLabel').innerText = today.getDate();
    document.getElementById('monthLabel').innerText = months[today.getMonth()];

    let currentInput = "";

    function runCheck() {
        currentInput = document.getElementById('carInput').value.trim();
        if (!currentInput) return alert("နံပါတ်ရိုက်ထည့်ပါ");
        const firstDigit = parseInt(currentInput.charAt(0));
        if (isNaN(firstDigit)) return alert("ဂဏန်းဖြင့် စတင်ရပါမည်");
        const isDateEven = (today.getDate() % 2 === 0);
        const isCarEven = (firstDigit % 2 === 0);
        document.getElementById('modalOverlay').style.display = 'flex';
        const mIcon = document.getElementById('mIcon');
        const mText = document.getElementById('mText');
        if (isCarEven === isDateEven) {
            mIcon.innerText = "✅";
            mText.innerHTML = `သင့်ယာဉ်နံပါတ် <span class="car-tag">${currentInput.toUpperCase()}</span> <span style="color:#10b981; font-weight:bold;">ယနေ့ မောင်းနှင်ခွင့်ရှိပါသည်။</span>`;
        } else {
            mIcon.innerText = "❌";
            mText.innerHTML = `သင့်ယာဉ်နံပါတ် <span class="car-tag">${currentInput.toUpperCase()}</span> <span style="color:#f43f5e; font-weight:bold;">ယနေ့ မောင်းနှင်ခွင့်မရှိပါ။</span>`;
        }
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const year = today.getFullYear();
        const month = today.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDigit = parseInt(currentInput.charAt(0));
        const isCarEven = (firstDigit % 2 === 0);
        doc.text(`Vehicle Schedule: ${currentInput.toUpperCase()}`, 14, 15);
        const data = [];
        for (let i = 1; i <= daysInMonth; i++) {
            const canDrive = (isCarEven === (i % 2 === 0));
            data.push([`${i} ${months[month]}`, canDrive ? "Allowed" : "Not Allowed"]);
        }
        doc.autoTable({
            startY: 25, head: [['Date', 'Status']], body: data, theme: 'grid',
            didParseCell: function(data) {
                if (data.column.index === 1) {
                    data.cell.styles.fillColor = data.cell.raw === "Allowed" ? [16, 185, 129] : [244, 63, 94];
                    data.cell.styles.textColor = [255, 255, 255];
                }
            }
        });
        doc.save(`${currentInput}_Schedule.pdf`);
    }

    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
</script>

</body>
</html>
