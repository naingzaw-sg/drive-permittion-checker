<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ယာဉ်နံပါတ် စစ်ဆေးရန်</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --danger: #f43f5e;
            --bg: #f1f5f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-card {
            width: 90%;
            max-width: 380px;
            background: white;
            padding: 40px 25px;
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .calendar-widget {
            width: 95px;
            margin: 0 auto 25px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .cal-month { background: var(--primary); color: white; padding: 6px; font-size: 0.8rem; font-weight: bold; }
        .cal-day { font-size: 2.4rem; font-weight: 800; color: #1e293b; padding: 10px 0; }

        h2 { color: #1e293b; font-size: 1.4rem; margin-bottom: 25px; }

        input {
            width: 100%;
            padding: 18px;
            margin-bottom: 20px;
            border: 2px solid #f1f5f9;
            border-radius: 18px;
            font-size: 1.2rem;
            text-align: center;
            box-sizing: border-box;
            background: #f8fafc;
            text-transform: uppercase;
            transition: 0.3s;
        }
        input:focus { outline: none; border-color: var(--primary); background: white; }

        .btn-check {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            width: 85%;
            max-width: 340px;
            padding: 35px 25px;
            border-radius: 35px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: popUp 0.3s ease-out;
        }

        @keyframes popUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-icon { font-size: 4.5rem; margin-bottom: 15px; display: block; }
        .modal-msg { font-size: 1.15rem; color: #334155; margin-bottom: 30px; line-height: 1.6; }
        .car-tag { font-weight: 800; color: #0f172a; font-size: 1.4rem; display: block; margin: 8px 0; border-bottom: 2px solid #f1f5f9; padding-bottom: 5px; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; }

        .btn-pdf { 
            padding: 16px; 
            background: #1e293b; 
            color: white; 
            border: none; 
            border-radius: 16px; 
            font-weight: bold; 
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-close { 
            padding: 12px; 
            background: #f8fafc;
            color: #64748b;
            border: 1px solid #e2e8f0; 
            border-radius: 16px; 
            font-weight: 600; 
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-close:hover { background: #f1f5f9; color: #334155; border-color: #cbd5e1; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="calendar-widget">
        <div id="monthLabel" class="cal-month">MMM</div>
        <div id="dayLabel" class="cal-day">00</div>
    </div>
    <h2>ယာဉ်မောင်းနှင်ခွင့် စစ်ဆေးမည်</h2>
    <input type="text" id="carInput" placeholder="ဥပမာ- 21A/1234">
    <button class="btn-check" onclick="runCheck()">စစ်ဆေးမည်</button>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal">
        <span id="mIcon" class="modal-icon"></span>
        <div id="mText" class="modal-msg"></div>
        <div class="btn-group">
            <button class="btn-pdf" onclick="generatePDF()">📅 တလစာ အချိန်စာရင်း</button>
            <button class="btn-close" onclick="closeModal()">ပိတ်မယ်</button>
        </div>
    </div>
</div>

<script>
    const today = new Date();
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    document.getElementById('dayLabel').innerText = today.getDate();
    document.getElementById('monthLabel').innerText = months[today.getMonth()];

    let currentInput = "";

    function runCheck() {
        currentInput = document.getElementById('carInput').value.trim();
        if (!currentInput) return alert("ယာဉ်နံပါတ် ရိုက်ထည့်ပါ");
        const firstDigit = parseInt(currentInput.charAt(0));
        if (isNaN(firstDigit)) return alert("ဂဏန်းဖြင့် စတင်ရပါမည်");
        
        const isDateEven = (today.getDate() % 2 === 0);
        const isCarEven = (firstDigit % 2 === 0);
        
        document.getElementById('modalOverlay').style.display = 'flex';
        const mIcon = document.getElementById('mIcon');
        const mText = document.getElementById('mText');

        if (isCarEven === isDateEven) {
            mIcon.innerText = "✅";
            mText.innerHTML = `သင့်ယာဉ်နံပါတ် <span class="car-tag">${currentInput.toUpperCase()}</span> <span style="color:#10b981; font-weight:bold;">ယနေ့ မောင်းနှင်ခွင့်ရှိပါသည်။</span>`;
        } else {
            mIcon.innerText = "❌";
            mText.innerHTML = `သင့်ယာဉ်နံပါတ် <span class="car-tag">${currentInput.toUpperCase()}</span> <span style="color:#f43f5e; font-weight:bold;">ယနေ့ မောင်းနှင်ခွင့်မရှိပါ။</span>`;
        }
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const year = today.getFullYear();
        const month = today.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDigit = parseInt(currentInput.charAt(0));
        const isCarEven = (firstDigit % 2 === 0);

        doc.setFontSize(16);
        doc.text(`Vehicle Schedule: ${currentInput.toUpperCase()}`, 14, 15);
        doc.setFontSize(10);
        doc.text(`Generated on: ${today.toLocaleDateString()}`, 14, 22);

        const data = [];
        for (let i = 1; i <= daysInMonth; i++) {
            const canDrive = (isCarEven === (i % 2 === 0));
            data.push([`${i} ${months[month]} ${year}`, canDrive ? "ALLOWED" : "NOT ALLOWED"]);
        }

        doc.autoTable({
            startY: 30,
            head: [['Date', 'Drive Status']],
            body: data,
            theme: 'grid',
            headStyles: { fillColor: [30, 41, 59] },
            didParseCell: function(data) {
                if (data.column.index === 1) {
                    data.cell.styles.fillColor = data.cell.raw === "ALLOWED" ? [16, 185, 129] : [244, 63, 94];
                    data.cell.styles.textColor = [255, 255, 255];
                    data.cell.styles.fontStyle = 'bold';
                }
            }
        });
        doc.save(`${currentInput}_Schedule.pdf`);
    }

    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    window.onclick = function(e) { if(e.target == document.getElementById('modalOverlay')) closeModal(); }
</script>

</body>
</html>
